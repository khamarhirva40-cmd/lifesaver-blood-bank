<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Request Blood - LifeSaver Blood Bank</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>

        body {
            background-color: #f8f9fa;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background-color: #b30000;
        }

        .navbar-brand,
        .nav-link {
            color: white !important;
        }

        .nav-link:hover {
            color: #ffd6d6 !important;
        }

        .page-title {
            color: #b30000;
            font-weight: bold;
        }

        .form-container {
            background-color: white;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 3px 10px #ddd;
        }

        footer {
            background-color: #333;
            color: white;
            padding: 20px;
        }

    </style>

</head>

<body>

<!-- NAVBAR -->

<nav class="navbar navbar-expand-lg">

    <div class="container">

        <a class="navbar-brand fw-bold" href="index.html">
            🩸 LifeSaver Blood Bank
        </a>

        <button
            class="navbar-toggler bg-light"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarMenu">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse" id="navbarMenu">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="index.html">
                        Home
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="about.html">
                        About
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="availability.html">
                        Blood Availability
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="donor.html">
                        Donate
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="request.html">
                        Request Blood
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="contact.html">
                        Contact
                    </a>
                </li>

            </ul>

        </div>

    </div>

</nav>


<!-- BLOOD REQUEST -->

<div class="container py-5">

    <h2 class="text-center page-title">
        Request Blood
    </h2>

    <p class="text-center text-muted mb-4">
        Submit your blood requirement and we will assist you.
    </p>


    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="form-container">

                <form onsubmit="submitRequest(event);
		return false;" novalidate>

                    <!-- Patient Name -->

                    <div class="mb-3">

                        <label class="form-label">
                            Patient Name
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="patientName"
                            placeholder="Enter patient name"
                            required>

                    </div>


                    <!-- Blood Group -->

                    <div class="mb-3">

                        <label class="form-label">
                            Required Blood Group
                        </label>

                        <select
                            class="form-select"
                            id="bloodGroup"
                            required>

                            <option value="">
                                Select Blood Group
                            </option>

                            <option>A+</option>
                            <option>A-</option>
                            <option>B+</option>
                            <option>B-</option>
                            <option>AB+</option>
                            <option>AB-</option>
                            <option>O+</option>
                            <option>O-</option>

                        </select>

                    </div>


                    <!-- Required Units -->

                    <div class="mb-3">

                        <label class="form-label">
                            Required Units
                        </label>

                        <input
                            type="number"
                            class="form-control"
                            id="units"
                            min="1"
                            placeholder="Enter number of units"
                            required>

                    </div>


                    <!-- Hospital -->

                    <div class="mb-3">

                        <label class="form-label">
                            Hospital Name
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="hospital"
                            placeholder="Enter hospital name"
                            required>

                    </div>


                    <!-- Contact -->

                    <div class="mb-3">

                        <label class="form-label">
                            Contact Number
                        </label>

                        <input
                            type="tel"
                            class="form-control"
                            id="contact"
                            placeholder="Enter contact number"
                            required>

                    </div>


                    <!-- Additional Information -->

                    <div class="mb-3">

                        <label class="form-label">
                            Additional Information
                        </label>

                        <textarea
                            class="form-control"
                            id="information"
                            rows="4"
                            placeholder="Enter any additional information">
                        </textarea>

                    </div>


                    <!-- Submit -->

                    <div class="text-center mt-4">

                        <button
                            type="submit"
                            class="btn btn-danger btn-lg">

                            Submit Blood Request

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>


<!-- FOOTER -->

<footer class="text-center mt-5">

    <p class="mb-0">

        © 2026 LifeSaver Blood Bank |
        Blood Donation Saves Lives

    </p>

</footer>


<!-- JAVASCRIPT -->

<script>
async function submitRequest(event) {

    event.preventDefault();

    const request = {

        name: document.getElementById("patientName").value,

        bloodGroup: document.getElementById("bloodGroup").value,

        units: document.getElementById("units").value,

        phone: document.getElementById("contact").value,

        hospital: document.getElementById("hospital").value

    };

    try {

        const response = await fetch(
            "http://lifesaver-blood-bank-api.onrender.com/api/requests",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(request)
            }
        );

        const result = await response.json();

        alert(result.message);

    } catch (error) {

        console.log(error);

        alert("Unable to connect to backend server.");

    }

}
</script>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
