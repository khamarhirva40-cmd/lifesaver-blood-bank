<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Donate Blood - LifeSaver Blood Bank</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>

        body {
            background-color: #f8f9fa;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background-color: #b30000;
        }

        .navbar-brand,
        .nav-link {
            color: white !important;
        }

        .nav-link:hover {
            color: #ffd6d6 !important;
        }

        .page-title {
            color: #b30000;
            font-weight: bold;
        }

        .form-container {
            background-color: white;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 3px 10px #ddd;
        }

        footer {
            background-color: #333;
            color: white;
            padding: 20px;
        }

    </style>

</head>

<body>

<!-- NAVBAR -->

<nav class="navbar navbar-expand-lg">

    <div class="container">

        <a class="navbar-brand fw-bold" href="index.html">
            🩸 LifeSaver Blood Bank
        </a>

        <button
            class="navbar-toggler bg-light"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarMenu">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse" id="navbarMenu">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="index.html">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="about.html">About</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="availability.html">
                        Blood Availability
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="donor.html">Donate</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="request.html">
                        Request Blood
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="contact.html">Contact</a>
                </li>

            </ul>

        </div>

    </div>

</nav>


<!-- DONOR REGISTRATION -->

<div class="container py-5">

    <h2 class="text-center page-title">
        Become a Blood Donor
    </h2>

    <p class="text-center text-muted mb-4">
        Register yourself as a donor and help save lives.
    </p>


    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="form-container">

                <form onsubmit="registerDonor(event)">

                    <!-- Full Name -->

                    <div class="mb-3">

                        <label class="form-label">
                            Full Name
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="name"
                            placeholder="Enter your full name"
                            required>

                    </div>


                    <!-- Age -->

                    <div class="mb-3">

                        <label class="form-label">
                            Age
                        </label>

                        <input
                            type="number"
                            class="form-control"
                            id="age"
                            min="18"
                            max="65"
                            placeholder="Enter your age"
                            required>

                    </div>


                    <!-- Gender -->

                    <div class="mb-3">

                        <label class="form-label">
                            Gender
                        </label>

                        <select
                            class="form-select"
                            id="gender"
                            required>

                            <option value="">
                                Select Gender
                            </option>

                            <option>Male</option>

                            <option>Female</option>

                            <option>Other</option>

                        </select>

                    </div>


                    <!-- Blood Group -->

                    <div class="mb-3">

                        <label class="form-label">
                            Blood Group
                        </label>

                        <select
                            class="form-select"
                            id="bloodGroup"
                            required>

                            <option value="">
                                Select Blood Group
                            </option>

                            <option>A+</option>
                            <option>A-</option>
                            <option>B+</option>
                            <option>B-</option>
                            <option>AB+</option>
                            <option>AB-</option>
                            <option>O+</option>
                            <option>O-</option>

                        </select>

                    </div>


                    <!-- Phone -->

                    <div class="mb-3">

                        <label class="form-label">
                            Phone Number
                        </label>

                        <input
                            type="tel"
                            class="form-control"
                            id="phone"
                            placeholder="Enter your phone number"
                            required>

                    </div>


                    <!-- City -->

                    <div class="mb-3">

                        <label class="form-label">
                            City
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="city"
                            placeholder="Enter your city"
                            required>

                    </div>


                    <!-- Submit -->

                    <div class="text-center mt-4">

                        <button
                            type="submit"
                            class="btn btn-danger btn-lg">

                            Register as Donor

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>


<!-- FOOTER -->

<footer class="text-center mt-5">

    <p class="mb-0">

        © 2026 LifeSaver Blood Bank |
        Blood Donation Saves Lives

    </p>

</footer>


<!-- JAVASCRIPT -->

<script>

async function registerDonor(event) {

    event.preventDefault();

    const donor = {

        name: document.getElementById("name").value,

        age: document.getElementById("age").value,

        gender: document.getElementById("gender").value,

        bloodGroup: document.getElementById("bloodGroup").value,

        phone: document.getElementById("phone").value,

        city: document.getElementById("city").value

    };


    try {

        const response = await fetch(
            "http://localhost:3000/api/donors",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(donor)
            }
        );


        const result = await response.json();

        alert(result.message);

    }

    catch (error) {

        alert(
            "Unable to connect to the backend server."
        );

    }

}
</script>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
